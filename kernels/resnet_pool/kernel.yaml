# atlas-kernels manifest for kernels/resnet_pool/ (schema atlas.kernel.v1).
# select rules use the fields of Merlin radiance kernel_library/selection.yaml: op, dtype, and shape
# constraints choose this family and, for projection_gemm, the variant (generator module) to emit.
schema: atlas.kernel.v1
family: resnet_pool
summary: 3x3 stride-two max pooling of FP8 channels-last tensors (exact for nonnegative inputs)
stage: standalone
entry_points:
  - module: atlas_resnet_pool
    function: MaxPool
    parameters: "source_offset, constants_offset, output_offset, channels, height, width; .assembly(arena_base)"
ops: ["aten.max_pool2d (kernel 3, stride 2, padding 1)"]
dtypes:
  input: fp8_e4m3 nonnegative
  output: fp8_e4m3
constraints:
  channels: multiple of 32
  layout: "channels last, one 8 KiB VMEM slot per input row"
select:
  - op: aten.max_pool2d
    dtype: fp8_e4m3
    shape: "kernel 3, stride 2"
    variant: MaxPool
models:
  - model: resnet50
    use: stem max pool
    shapes: ["64x112x112 -> 64x56x56"]
generator: "make gen-resnet_pool ARGS=\"--input CxHxW\""
tests: [tests/test_resnet_maxpool.py]
checks: [geometry tests, execution on npu_model 47b8599 through lib/atlas_rtl_reference.py (needs NPU_MODEL)]
run_tests: "make test-resnet_pool NPU_MODEL=<npu_model 47b8599 checkout>"
