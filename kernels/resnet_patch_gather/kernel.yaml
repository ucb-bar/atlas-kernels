# atlas-kernels manifest for kernels/resnet_patch_gather/ (schema atlas.kernel.v1).
# select rules use the fields of Merlin radiance kernel_library/selection.yaml: op, dtype, and shape
# constraints choose this family and, for projection_gemm, the variant (generator module) to emit.
schema: atlas.kernel.v1
family: resnet_patch_gather
summary: device row gathers from FP8 channels-last tensors into tiled MXU A operands (1x1 and kxk im2col)
stage: A-operand source of a projection_gemm launch (direct_input=)
entry_points:
  - {module: atlas_resnet_input, function: DirectInput, parameters: "offset, channels, height, width, stride=1, zero_offset=0, kernel=1, padding=0"}
  - {module: atlas_resnet_input, function: kernel_major_weights, parameters: "weights, channels, kernel, n"}
ops: [aten.convolution (im2col gather)]
dtypes:
  input: fp8_e4m3
  output: fp8_e4m3 A tiles
constraints:
  channels: "power of two, multiple of 32"
  kernel: odd with same padding
  stride: 1 or 2
  kxk: needs the blocked recipe
select:
  - {op: aten.convolution, dtype: fp8_e4m3, shape: "kernel 1 or 3, stride 1 or 2", variant: projection_gemm with direct_input}
models:
  - {model: resnet50, use: 1x1 and 3x3 convolutions after the stem}
generator: "make gen-resnet_patch_gather ARGS=\"--input CxHxW --kernel 1|3 [--stride 2] --n N\""
tests: [tests/test_resnet_direct_input.py]
checks: [bounds tests, gather equals host patches on npu_model 47b8599 (needs NPU_MODEL)]
run_tests: "make test-resnet_patch_gather NPU_MODEL=<npu_model 47b8599 checkout>"
