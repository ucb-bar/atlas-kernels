# Starter placement for Merlin's small causal decoder (merlin:examples/workloads/causal_decoder/loader.py).
#
# Copy this file for a new model. Only ops an existing atlas-kernels family computes are mapped; everything else stays
# unmapped and is listed with its FLOPs by build_table.py --allow-unmapped and by bench_model.py. No rule claims a
# qualified build: there is no `launches` entry under builds, so derived device work is reported, not compared.
# Rule fields are documented at the top of coverage/mapping.yaml. Citations name atlas-kernels files (this repository).
#
# Left unmapped on purpose:
# - the attention core (QK^T, divide by sqrt(8), mask add, softmax, PV): the family supports dimensions 64, 128, and 256
#   (atlas-kernels: kernels/attention/gen.py) and this decoder has 4 heads of dimension 8;
# - embedding, chunk, reshape, and transpose: data movement with no kernel family here; a host graph would do it.

schema: atlas.coverage.mapping.v1

kernels:
  projection_gemm: FP8 E4M3 projection GEMM
  epilogue: fused GEMM epilogue (SiLU on gate, gate x up multiply with FP8 output)
  rne_add: exact BF16 residual add fused into the producing projection's epilogue
  rmsnorm: RMSNorm with FP8 output for the next projection

builds: {}

bench:
  causal_decoder: {panel_rows: 128}

rules:
  causal_decoder:
    - {match: {op: aten.linear.default}, where: atlas:projection_gemm, note: "Linear without bias is Y = X W^T, the projection GEMM's product (kernels/projection_gemm/reference.py); the device computes it from FP8 E4M3 operands with
      BF16 accumulation, so fidelity, not equality, is what to expect", cite: [atlas-kernels:kernels/projection_gemm/reference.py, atlas-kernels:kernels/projection_gemm/atlas_program.py]}
    - {match: {op: aten.rms_norm.default}, where: atlas:rmsnorm, launch: {family: rmsnorm, per: {op: aten.rms_norm.default}}, note: "torch.nn.RMSNorm with a weight is the kernel's x * rsqrt(mean(x^2) + eps) * gamma (kernels/rmsnorm/reference.py);
      the kernel uses eps 1e-5 where torch.nn.RMSNorm(eps=None) uses the float32 machine epsilon, and the streamed standalone generator supports this width-32 norm with physical rows padded to 32", cite: [atlas-kernels:kernels/rmsnorm/reference.py,
      atlas-kernels:kernels/rmsnorm/gen.py]}
    - {match: {op: aten.silu.default, source: 'loader.py:forward:30'}, where: atlas:epilogue, launch: {family: epilogue, fuse_into: [gate], steps: [silu]}, note: "SiLU applied to the gate projection's output, the gate epilogue Step('silu')
      (kernels/epilogue/reference.py)", cite: [atlas-kernels:kernels/epilogue/reference.py, atlas-kernels:kernels/epilogue/atlas_epilogue.py]}
    - {match: {op: aten.mul.Tensor, source: 'loader.py:forward:30'}, where: atlas:epilogue, launch: {family: epilogue, fuse_into: [up], steps: [mul], output: fp8, consumer_width: 64}, note: "SiLU(gate) x up multiplies the up projection's
      output by the gate tile, the up epilogue Step('mul') with FP8 output in the layout the down projection reads (64 wide)", cite: [atlas-kernels:kernels/epilogue/reference.py, atlas-kernels:kernels/epilogue/atlas_epilogue.py]}
    - {match: {op: aten.add.Tensor, source: ['loader.py:forward:28', 'loader.py:forward:30'], out: [1, 8, 32]}, where: atlas:rne_add, launch: {family: rne_add, fuse_into: [projection, down]}, note: "hidden + projection(...) and hidden
      + down(...) add a residual to a projection output, the Step('add_rne') epilogue (kernels/rne_add/reference.py): the exact sum rounded to BF16", cite: [atlas-kernels:kernels/rne_add/reference.py, atlas-kernels:kernels/rne_add/atlas_rne_add.py]}
